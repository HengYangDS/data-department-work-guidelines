# Prettier owns source spacing and container layout. These native rule groups
# must not supply another spacing verdict on formatter-accepted source.
whitespace = false
blank_lines = false
indentation = false
MD019 = false
MD021 = false
MD023 = false
MD058 = false
MD060 = false

[MD013]
line_length = 80
code_blocks = false
tables = false
headings = false

[MD024]
siblings_only = true
