name = "Documentation verification"
accepted_branch = "dev"
release_branch = "main"
timeout_minutes = 20

[supply]
mise_version = "2026.11.11"

# CI runs only on ARM macOS, and both Forges select it by one label: GitHub's hosted
# `macos-latest`, and on GitLab the project-locked macOS guest's runners, which carry the same
# label beside `review` or `protected` (the owner's decision of 2026-11-25).
[github]
runners = ["macos-latest"]

[gitlab.variables]
MISE_CONFIG_DIR = "$CI_PROJECT_DIR/build/runtime/work/mise-config"
MISE_DATA_DIR = "$CI_PROJECT_DIR/build/runtime/tool-cache/mise"
MISE_CEILING_PATHS = "$CI_PROJECT_DIR/.."
MISE_TRUSTED_CONFIG_PATHS = "$CI_PROJECT_DIR/.config/mise/config.toml"
MISE_YES = "1"

[gitlab.runners.macos]
system = "macos"
review_tags = ["macos-latest", "review"]
protected_tags = ["macos-latest", "protected"]

[gitlab.runners.macos.variables]
# The shell runner's builds directory persists; this sits outside the cloned project, one store per concurrent slot.
MISE_CACHE_DIR = "$CI_BUILDS_DIR/mise-cache-$CI_CONCURRENT_ID"
