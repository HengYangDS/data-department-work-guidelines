min_version = "2026.10.14"

# Contributors and hosted jobs install ETHOS from its published release. These tables are the
# release's own Mise declaration, unchanged; mise.lock pins the archive of each declared platform.
# ETHOS is the only declared tool and supplies its own Node and native checks.
[tools."http:ethos"]
version = "0.2.0-alpha.22"

[tools."http:ethos".platforms]
linux-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.22/ethos-0.2.0-alpha.22-linux-arm64.tar.gz", checksum = "sha256:07299ec33741eef1ff9693d81c3ea045350e932a678d97d1aba6651c6c09264c", bin_path = "ethos/bin" }
linux-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.22/ethos-0.2.0-alpha.22-linux-x64.tar.gz", checksum = "sha256:2fe2b6458fa25e9314f6ebff876007fe377ccde5d72507356ebada92b979a67e", bin_path = "ethos/bin" }
macos-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.22/ethos-0.2.0-alpha.22-macos-arm64.tar.gz", checksum = "sha256:044fbf6a52c8ab2ec9d58051851038a4645434a67d6a4e6bf03684667466e170", bin_path = "ethos/bin" }
windows-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.22/ethos-0.2.0-alpha.22-windows-arm64.tar.gz", checksum = "sha256:cbeba21f59ed755a189015a6ef4a6385046596b9f071ecb7627bda55dca4f6a5", bin_path = "ethos/bin" }
windows-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.22/ethos-0.2.0-alpha.22-windows-x64.tar.gz", checksum = "sha256:0909f1a8028597a0644039ad11ddad16519b3728d8adafa644777bdb9ef50d61", bin_path = "ethos/bin" }

[settings]
locked = true
# Native `mise lock` writes these platforms; its default set omits Windows ARM64.
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64", "windows-arm64", "windows-x64"]

[tasks.bootstrap]
description = "Install the locked ETHOS release"
run = "mise install --locked"

[tasks.check]
description = "Check selected source formatting and generated CI files without writing"
run = ["ethos lane format --check --json", "ethos lane project --check --json"]

[tasks.fix]
description = "Apply native formatting after exact Work Lane admission; pass --expect-head OID"
run = "ethos lane format --apply --authorize --json"
