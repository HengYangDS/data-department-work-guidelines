min_version = "2026.10.14"

# Contributors and hosted jobs install ETHOS from its published release. These tables are the
# release's own Mise declaration, unchanged; mise.lock pins the archive of each declared platform.
# ETHOS is the only declared tool and supplies its own Node and native checks.
[tools."http:ethos"]
version = "0.2.0-alpha.26"

[tools."http:ethos".platforms]
linux-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.26/ethos-0.2.0-alpha.26-linux-arm64.tar.gz", checksum = "sha256:31797b7abe40248fa66c6454c6e52df692bdfa1e78d4e397501c458330226336", bin_path = "ethos/bin" }
linux-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.26/ethos-0.2.0-alpha.26-linux-x64.tar.gz", checksum = "sha256:1fadeb14f0fc90289fad4e1a6ff0b94972a79f346c92bf620043bca737566fa4", bin_path = "ethos/bin" }
macos-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.26/ethos-0.2.0-alpha.26-macos-arm64.tar.gz", checksum = "sha256:eb788996f6d78fe885cbe18c1b71fbf835c6abb04c6eb7eeb924ecbe6c18d603", bin_path = "ethos/bin" }
windows-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.26/ethos-0.2.0-alpha.26-windows-arm64.tar.gz", checksum = "sha256:31b4c6db0650d4f97a844e0e307f15aca693546052608de5990cd03e2b85f246", bin_path = "ethos/bin" }
windows-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.26/ethos-0.2.0-alpha.26-windows-x64.tar.gz", checksum = "sha256:3db6eb1bd6b436363f469611f53631302a1623cf22f9592bc772e5518ba49b59", bin_path = "ethos/bin" }

[settings]
locked = true
# Native `mise lock` writes these platforms; its default set omits Windows ARM64.
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64", "windows-arm64", "windows-x64"]

[tasks.bootstrap]
description = "Install the locked ETHOS release"
run = "mise install --locked"

[tasks.check]
description = "Check selected source formatting and generated CI files without writing"
run = ["ethos lane format --check --json", "ethos lane project --check --json"]

[tasks.fix]
description = "Apply native formatting after exact Work Lane admission; pass --expect-head OID"
run = "ethos lane format --apply --authorize --json"
