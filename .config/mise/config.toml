min_version = "2026.10.14"

# Contributors and hosted jobs install ETHOS from its published release. These tables are the
# release's own Mise declaration, unchanged; mise.lock pins the archive of each declared platform.
# ETHOS is the only declared tool and supplies its own Node and native checks.
[tools."http:ethos"]
version = "0.2.0-alpha.30"

[tools."http:ethos".platforms]
linux-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.30/ethos-0.2.0-alpha.30-linux-arm64.tar.gz", checksum = "sha256:ec8903d9f7081096b076677a5c4d95f9277e31d0d773683887d9d868729c3337", bin_path = "ethos/bin" }
linux-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.30/ethos-0.2.0-alpha.30-linux-x64.tar.gz", checksum = "sha256:9ef0a3b72770d2da443181247bce0a9f4a91b4ae85a85c3a389b630fdcfb257b", bin_path = "ethos/bin" }
macos-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.30/ethos-0.2.0-alpha.30-macos-arm64.tar.gz", checksum = "sha256:adaec74bebda90adfd8942b68a1fbf55fb4f94215f6b3d55602ce360a2657466", bin_path = "ethos/bin" }
windows-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.30/ethos-0.2.0-alpha.30-windows-arm64.tar.gz", checksum = "sha256:699edf21f6c7a57fa4830c8ccb2b81cb4bce9fc214e77d9a36092c24f3e0c187", bin_path = "ethos/bin" }
windows-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.30/ethos-0.2.0-alpha.30-windows-x64.tar.gz", checksum = "sha256:bd3ecb39e5f0b89c06e57235e253edbe0a51ae1560273ca2e2c22cea8e8910f7", bin_path = "ethos/bin" }

[settings]
locked = true
# Native `mise lock` writes these platforms; its default set omits Windows ARM64.
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64", "windows-arm64", "windows-x64"]

[tasks.bootstrap]
description = "Install the locked ETHOS release"
run = "mise install --locked"

[tasks.check]
description = "Check selected source formatting and generated CI files without writing"
run = ["ethos lane format --check --json", "ethos lane project --check --json"]

[tasks.fix]
description = "Apply native formatting after exact Work Lane admission; pass --expect-head OID"
run = "ethos lane format --apply --authorize --json"
