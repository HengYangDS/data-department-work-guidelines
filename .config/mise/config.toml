min_version = "2026.10.14"

# Hosted jobs install ETHOS from its published release. These tables are the release's own
# Mise declaration, unchanged; mise.lock pins the archive of each declared platform.
[tools."http:ethos"]
version = "0.2.0-alpha.13"

[tools."http:ethos".platforms]
linux-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.13/ethos-0.2.0-alpha.13-linux-arm64.tar.gz", checksum = "sha256:349eb76e4f07e8de78dcca16e90f328d242ffba75f3239f5d942a4e4afabf66b", bin_path = "ethos/bin" }
linux-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.13/ethos-0.2.0-alpha.13-linux-x64.tar.gz", checksum = "sha256:7a572d3756680a524776f3589ec02a82f4c61948719becac8200efa0b3d6b069", bin_path = "ethos/bin" }
macos-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.13/ethos-0.2.0-alpha.13-macos-arm64.tar.gz", checksum = "sha256:6851515430bdb409c3cffac0f5114b11c839ca2a7b88d016022af439bce1b052", bin_path = "ethos/bin" }
windows-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.13/ethos-0.2.0-alpha.13-windows-x64.tar.gz", checksum = "sha256:165f9a5ca4a5770580402755a90af0254e8f2050b6d7deceb906690e55357296", bin_path = "ethos/bin" }

# package.json owns both development versions and npm archive integrity.
# The native idiomatic parser needs no executable template or second declaration.
[tool_alias]
npm = "npm:npm"

[settings]
locked = true
idiomatic_version_file_enable_tools = ["node", "npm"]

[settings.npm]
package_manager = "npm"

[tasks.bootstrap]
description = "Prepare the currently declared Node and npm through locked native Mise supply"
run = "mise install --locked node npm"

[tasks.check]
description = "Check selected source formatting and generated CI files without writing"
run = ["ethos lane format --check --json", "ethos lane project --check --json"]

[tasks.fix]
description = "Apply native formatting after exact Work Lane admission; pass --expect-head OID"
run = "ethos lane format --apply --authorize --json"
