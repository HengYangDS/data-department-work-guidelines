min_version = "2026.10.14"

# Contributors and hosted jobs install ETHOS from its published release. These tables are the
# release's own Mise declaration, unchanged; mise.lock pins the archive of each declared platform.
# ETHOS is the only declared tool and supplies its own Node and native checks.
[tools."http:ethos"]
version = "0.2.0-beta.6"

[tools."http:ethos".platforms]
linux-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.6/ethos-0.2.0-beta.6-linux-arm64.tar.gz", checksum = "sha256:5c2af827a54c433a13fba9f1fc5a0668e4a5ed0039cc5c65f8059b61e1436ec7", bin_path = "ethos/bin" }
linux-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.6/ethos-0.2.0-beta.6-linux-x64.tar.gz", checksum = "sha256:d61553c690f1f7f61171f0afc2b1fe9d20fbac0240fb36bec88b42d92802ecc8", bin_path = "ethos/bin" }
macos-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.6/ethos-0.2.0-beta.6-macos-arm64.tar.gz", checksum = "sha256:cb7a79bd181c6f8e1b75b251526420a3344a58aea76a9a74d1048fa36b9de54e", bin_path = "ethos/bin" }
windows-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.6/ethos-0.2.0-beta.6-windows-arm64.tar.gz", checksum = "sha256:032c2b2f0addd96935d59e26059aea8b2e444c50912fcf3eb96a48f128158def", bin_path = "ethos/bin" }
windows-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.6/ethos-0.2.0-beta.6-windows-x64.tar.gz", checksum = "sha256:805fdfb707fe6df2016db8efbf5290d9668d653b5ba7467c49a4b7eb766eb406", bin_path = "ethos/bin" }

[settings]
locked = true
# Native `mise lock` writes these platforms; its default set omits Windows ARM64.
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64", "windows-arm64", "windows-x64"]

[tasks.bootstrap]
description = "Install the locked ETHOS release"
run = "mise install --locked"

[tasks.check]
description = "Check selected source formatting and generated CI files without writing"
run = ["ethos lane format --check --json", "ethos lane project --check --json"]

[tasks.fix]
description = "Apply native formatting after exact Work Lane admission; pass --expect-head OID"
run = "ethos lane format --apply --authorize --json"
