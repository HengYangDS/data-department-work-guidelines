min_version = "2026.10.14"

# Contributors and hosted jobs install ETHOS from its published release. These tables are the
# release's own Mise declaration, unchanged; mise.lock pins the archive of each declared platform.
# ETHOS is the only declared tool and supplies its own Node and native checks.
[tools."http:ethos"]
version = "0.2.0-beta.10"

[tools."http:ethos".platforms]
linux-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.10/ethos-0.2.0-beta.10-linux-arm64.tar.gz", checksum = "sha256:83ffab595486d3348ea66a2037744c4e1aed0d6ec3096773885aa69382bade0d", bin_path = "ethos/bin" }
linux-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.10/ethos-0.2.0-beta.10-linux-x64.tar.gz", checksum = "sha256:0b7fc1b3644acece99dac60fa72cd26f657c7114aeec1b9234be5de3fc618651", bin_path = "ethos/bin" }
macos-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.10/ethos-0.2.0-beta.10-macos-arm64.tar.gz", checksum = "sha256:d2b0823b9fa9eee14e3e1552be3dd1e08ddef0805da4413f9dc89754fb4a1771", bin_path = "ethos/bin" }
windows-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.10/ethos-0.2.0-beta.10-windows-arm64.tar.gz", checksum = "sha256:83da972766ddbe19c78cf38ca2487c55ea0dbcc77c22f91d031b956e67543c72", bin_path = "ethos/bin" }
windows-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.10/ethos-0.2.0-beta.10-windows-x64.tar.gz", checksum = "sha256:7579ac5d119a8039b422a18e4b20db3f3088100e5eb9664d7b4e80131b2c4f81", bin_path = "ethos/bin" }

[settings]
locked = true
# A declared tool resolves its newest release at once; Mise's default hides one younger than 24 hours.
minimum_release_age = "0h"
# Native `mise lock` writes these platforms; its default set omits Windows ARM64.
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64", "windows-arm64", "windows-x64"]

[tasks.bootstrap]
description = "Install the locked ETHOS release"
run = "mise install --locked"

[tasks.check]
description = "Check selected source formatting and generated CI files without writing"
run = ["ethos lane format --check --json", "ethos lane project --check --json"]

[tasks.fix]
description = "Apply native formatting after exact Work Lane admission; pass --expect-head OID"
run = "ethos lane format --apply --authorize --json"
