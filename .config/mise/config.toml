min_version = "2026.10.14"

# Contributors and hosted jobs install ETHOS from its published release. These tables are the
# release's own Mise declaration, unchanged; mise.lock pins the archive of each declared platform.
# ETHOS is the only declared tool and supplies its own Node and native checks.
[tools."http:ethos"]
version = "0.2.0-alpha.19"

[tools."http:ethos".platforms]
linux-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.19/ethos-0.2.0-alpha.19-linux-arm64.tar.gz", checksum = "sha256:277a887e40801a1fd35e92659b48919ef4620b45f34c53404311e0b1040bcc63", bin_path = "ethos/bin" }
linux-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.19/ethos-0.2.0-alpha.19-linux-x64.tar.gz", checksum = "sha256:b3dd983214084216b8094f439801e59618fd31a355bdaf1ffba4772edfdb201f", bin_path = "ethos/bin" }
macos-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.19/ethos-0.2.0-alpha.19-macos-arm64.tar.gz", checksum = "sha256:5a0f745f327a4af890b0c62f5cba3985fb4faf67ab03a6ba6d6313922d9d4130", bin_path = "ethos/bin" }
windows-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.19/ethos-0.2.0-alpha.19-windows-x64.tar.gz", checksum = "sha256:015d29b34d87ec3eb5946a4ce293aa0b9df7ea8d83fd9f42e1b50c5023be8661", bin_path = "ethos/bin" }

[settings]
locked = true

[tasks.check]
description = "Check selected source formatting and generated CI files without writing"
run = ["ethos lane format --check --json", "ethos lane project --check --json"]

[tasks.fix]
description = "Apply native formatting after exact Work Lane admission; pass --expect-head OID"
run = "ethos lane format --apply --authorize --json"
