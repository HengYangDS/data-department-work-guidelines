min_version = "2026.10.14"

# Contributors and hosted jobs install ETHOS from its published release. These tables are the
# release's own Mise declaration, unchanged; mise.lock pins the archive of each declared platform.
# ETHOS is the only declared tool and supplies its own Node and native checks.
[tools."http:ethos"]
version = "0.2.0-alpha.28"

[tools."http:ethos".platforms]
linux-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.28/ethos-0.2.0-alpha.28-linux-arm64.tar.gz", checksum = "sha256:b14cc2267c2a91d353c6d0001a8c7f1c3030d40b3e4d8c7459fa57ac9afb3d81", bin_path = "ethos/bin" }
linux-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.28/ethos-0.2.0-alpha.28-linux-x64.tar.gz", checksum = "sha256:0073a994fda90b747cada7d58f5b2cb69e86d8c17299bdc1156a43c213edd66a", bin_path = "ethos/bin" }
macos-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.28/ethos-0.2.0-alpha.28-macos-arm64.tar.gz", checksum = "sha256:b2eab25fa85bcd1a099139b2ea0dfaf294c8fe1e0cd20163e3af56ec42532483", bin_path = "ethos/bin" }
windows-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.28/ethos-0.2.0-alpha.28-windows-arm64.tar.gz", checksum = "sha256:a14c756cb2ed391362b513734311e2a11c057fb14e0f30b43d5823d61a089938", bin_path = "ethos/bin" }
windows-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.28/ethos-0.2.0-alpha.28-windows-x64.tar.gz", checksum = "sha256:74df9814cb9eeb3212c59d438de5f362fdd15d6eafd72ff57421bf7c5e5266cd", bin_path = "ethos/bin" }

[settings]
locked = true
# Native `mise lock` writes these platforms; its default set omits Windows ARM64.
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64", "windows-arm64", "windows-x64"]

[tasks.bootstrap]
description = "Install the locked ETHOS release"
run = "mise install --locked"

[tasks.check]
description = "Check selected source formatting and generated CI files without writing"
run = ["ethos lane format --check --json", "ethos lane project --check --json"]

[tasks.fix]
description = "Apply native formatting after exact Work Lane admission; pass --expect-head OID"
run = "ethos lane format --apply --authorize --json"
