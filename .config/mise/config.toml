min_version = "2026.10.14"

# Hosted jobs install ETHOS from its published release. These tables are the release's own
# Mise declaration, unchanged; mise.lock pins the archive of each declared platform.
[tools."http:ethos"]
version = "0.2.0-alpha.17"

[tools."http:ethos".platforms]
linux-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.17/ethos-0.2.0-alpha.17-linux-arm64.tar.gz", checksum = "sha256:ebfe26fd9bb928cf41c8ebec73679df9041645a54a0fa0abc5c9e72739aa1ffc", bin_path = "ethos/bin" }
linux-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.17/ethos-0.2.0-alpha.17-linux-x64.tar.gz", checksum = "sha256:fbf26d451b4358ebbab41f23db1c0f062a637532483b29e558c54fbe421cad42", bin_path = "ethos/bin" }
macos-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.17/ethos-0.2.0-alpha.17-macos-arm64.tar.gz", checksum = "sha256:6e4d8923d63727e64fe724d4b9e6a459c2515a7679238b999949a88bc7ed167d", bin_path = "ethos/bin" }
windows-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.17/ethos-0.2.0-alpha.17-windows-x64.tar.gz", checksum = "sha256:1b4cab64d4bc4787be397c44871d0afb98767177e551fbc883c501b55c1f7fb0", bin_path = "ethos/bin" }

# package.json owns both development versions and npm archive integrity.
# The native idiomatic parser needs no executable template or second declaration.
[tool_alias]
npm = "npm:npm"

[settings]
locked = true
idiomatic_version_file_enable_tools = ["node", "npm"]

[settings.npm]
package_manager = "npm"

[tasks.bootstrap]
description = "Prepare the currently declared Node and npm through locked native Mise supply"
run = "mise install --locked node npm"

[tasks.check]
description = "Check selected source formatting and generated CI files without writing"
run = ["ethos lane format --check --json", "ethos lane project --check --json"]

[tasks.fix]
description = "Apply native formatting after exact Work Lane admission; pass --expect-head OID"
run = "ethos lane format --apply --authorize --json"
