min_version = "2026.10.14"

# Contributors and hosted jobs install ETHOS from its published release. These tables are the
# release's own Mise declaration, unchanged; mise.lock pins the archive of each declared platform.
# ETHOS is the only declared tool and supplies its own Node and native checks.
[tools."http:ethos"]
version = "0.2.0-alpha.21"

[tools."http:ethos".platforms]
linux-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.21/ethos-0.2.0-alpha.21-linux-arm64.tar.gz", checksum = "sha256:3d6d679064291800e005e93d055a876aaaadc63f9dba6a20629239c32990a350", bin_path = "ethos/bin" }
linux-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.21/ethos-0.2.0-alpha.21-linux-x64.tar.gz", checksum = "sha256:aa8bb94b5f16bd12bc0a12b96a3008f146877d0039d81b28cec28d5355fcd873", bin_path = "ethos/bin" }
macos-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.21/ethos-0.2.0-alpha.21-macos-arm64.tar.gz", checksum = "sha256:0be57d6e2fae6f8af70c07c6d1449c1ef4741a11ee1d0e2600c7f2551ac4418b", bin_path = "ethos/bin" }
windows-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.21/ethos-0.2.0-alpha.21-windows-arm64.tar.gz", checksum = "sha256:432fc27b07d6b1bd9545907be72ded593ecb83b49f000d9bf3c3360d0b1c719f", bin_path = "ethos/bin" }
windows-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.21/ethos-0.2.0-alpha.21-windows-x64.tar.gz", checksum = "sha256:f4e8ec759eddc20191ca34242b10e1c40992b364f0ccadf07beb82bd12dd6c70", bin_path = "ethos/bin" }

[settings]
locked = true
# Native `mise lock` writes these platforms; its default set omits Windows ARM64.
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64", "windows-arm64", "windows-x64"]

[tasks.bootstrap]
description = "Install the locked ETHOS release"
run = "mise install --locked"

[tasks.check]
description = "Check selected source formatting and generated CI files without writing"
run = ["ethos lane format --check --json", "ethos lane project --check --json"]

[tasks.fix]
description = "Apply native formatting after exact Work Lane admission; pass --expect-head OID"
run = "ethos lane format --apply --authorize --json"
