min_version = "2026.10.14"

# Contributors and hosted jobs install ETHOS from its published release. These tables are the
# release's own Mise declaration, unchanged; mise.lock pins the archive of each declared platform.
# ETHOS is the only declared tool and supplies its own Node and native checks.
[tools."http:ethos"]
version = "0.2.0-beta.2"

[tools."http:ethos".platforms]
linux-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.2/ethos-0.2.0-beta.2-linux-arm64.tar.gz", checksum = "sha256:5f5edfdc0f7ec44a59afdcc0ec1cfa3786b89587ccee5d307bcfec10ed37c244", bin_path = "ethos/bin" }
linux-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.2/ethos-0.2.0-beta.2-linux-x64.tar.gz", checksum = "sha256:6278c961f97b9d3bdbb37ee668d96e71c570e2a79615ae1fb25749f5e7fd1602", bin_path = "ethos/bin" }
macos-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.2/ethos-0.2.0-beta.2-macos-arm64.tar.gz", checksum = "sha256:12aaad93c7edc9b4601aa292e1f8dfab461a8f46ad61dceb42164570e34e155a", bin_path = "ethos/bin" }
windows-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.2/ethos-0.2.0-beta.2-windows-arm64.tar.gz", checksum = "sha256:c8d3eb4e9f87a6f813721321760d26aaec601bd14f528d890926234cfd01fb7f", bin_path = "ethos/bin" }
windows-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.2/ethos-0.2.0-beta.2-windows-x64.tar.gz", checksum = "sha256:486ab19d8519a97099dc89b3a7f4240594d18cc966091cf15164745e69a8ddfc", bin_path = "ethos/bin" }

[settings]
locked = true
# Native `mise lock` writes these platforms; its default set omits Windows ARM64.
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64", "windows-arm64", "windows-x64"]

[tasks.bootstrap]
description = "Install the locked ETHOS release"
run = "mise install --locked"

[tasks.check]
description = "Check selected source formatting and generated CI files without writing"
run = ["ethos lane format --check --json", "ethos lane project --check --json"]

[tasks.fix]
description = "Apply native formatting after exact Work Lane admission; pass --expect-head OID"
run = "ethos lane format --apply --authorize --json"
