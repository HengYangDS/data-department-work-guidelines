min_version = "2026.10.14"

# Contributors and hosted jobs install ETHOS from its published release. These tables are the
# release's own Mise declaration, unchanged; mise.lock pins the archive of each declared platform.
# ETHOS is the only declared tool and supplies its own Node and native checks.
[tools."http:ethos"]
version = "0.2.0-alpha.27"

[tools."http:ethos".platforms]
linux-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.27/ethos-0.2.0-alpha.27-linux-arm64.tar.gz", checksum = "sha256:9765ef79507d386ab666645f5aede538b6a0509133fabf5e029f46cc3e084f63", bin_path = "ethos/bin" }
linux-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.27/ethos-0.2.0-alpha.27-linux-x64.tar.gz", checksum = "sha256:0ea2f59f7045fdfd28f351b263044910ee29da77fb9e412277645cab5f76b330", bin_path = "ethos/bin" }
macos-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.27/ethos-0.2.0-alpha.27-macos-arm64.tar.gz", checksum = "sha256:fe7b394b10c69e4a04f642e21a996114142fa920ca2b7432f1c30a57bc29070f", bin_path = "ethos/bin" }
windows-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.27/ethos-0.2.0-alpha.27-windows-arm64.tar.gz", checksum = "sha256:0354b5737b816bcb313ce271f44d7e8ba8b8e1b6b948d44c410a631286b0859a", bin_path = "ethos/bin" }
windows-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.27/ethos-0.2.0-alpha.27-windows-x64.tar.gz", checksum = "sha256:657c8105bcb947c2cc64c0d2cd3428f3c8254dfacf521ab0e26a41561a50c319", bin_path = "ethos/bin" }

[settings]
locked = true
# Native `mise lock` writes these platforms; its default set omits Windows ARM64.
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64", "windows-arm64", "windows-x64"]

[tasks.bootstrap]
description = "Install the locked ETHOS release"
run = "mise install --locked"

[tasks.check]
description = "Check selected source formatting and generated CI files without writing"
run = ["ethos lane format --check --json", "ethos lane project --check --json"]

[tasks.fix]
description = "Apply native formatting after exact Work Lane admission; pass --expect-head OID"
run = "ethos lane format --apply --authorize --json"
