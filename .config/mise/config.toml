min_version = "2026.10.14"

# Contributors and hosted jobs install ETHOS from its published release. These tables are the
# release's own Mise declaration, unchanged; mise.lock pins the archive of each declared platform.
# ETHOS is the only declared tool and supplies its own Node and native checks.
[tools."http:ethos"]
version = "0.2.0-beta.8"

[tools."http:ethos".platforms]
linux-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.8/ethos-0.2.0-beta.8-linux-arm64.tar.gz", checksum = "sha256:56ef3566b1226ce71f5a2d6fe523ac04f2ef8c190a0a4263353dc1d3b50ce094", bin_path = "ethos/bin" }
linux-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.8/ethos-0.2.0-beta.8-linux-x64.tar.gz", checksum = "sha256:f3875787432e70d7afc3bc10af8522311c894ae96b3b51d59b76dfcd897df460", bin_path = "ethos/bin" }
macos-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.8/ethos-0.2.0-beta.8-macos-arm64.tar.gz", checksum = "sha256:4a5dba83f53a0b082c2c7c428fa2e4e37c9abdc3270b4c3a76d7f3e8f759d960", bin_path = "ethos/bin" }
windows-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.8/ethos-0.2.0-beta.8-windows-arm64.tar.gz", checksum = "sha256:864bce1628496d6651eeadfb070f3ed019e88605710aaba2fccbf70273f17be4", bin_path = "ethos/bin" }
windows-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.8/ethos-0.2.0-beta.8-windows-x64.tar.gz", checksum = "sha256:e3a899229afab35b47170c967ccc0d4560bc11dcc99477177118c97702620303", bin_path = "ethos/bin" }

[settings]
locked = true
# Native `mise lock` writes these platforms; its default set omits Windows ARM64.
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64", "windows-arm64", "windows-x64"]

[tasks.bootstrap]
description = "Install the locked ETHOS release"
run = "mise install --locked"

[tasks.check]
description = "Check selected source formatting and generated CI files without writing"
run = ["ethos lane format --check --json", "ethos lane project --check --json"]

[tasks.fix]
description = "Apply native formatting after exact Work Lane admission; pass --expect-head OID"
run = "ethos lane format --apply --authorize --json"
