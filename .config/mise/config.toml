min_version = "2026.10.14"

# Hosted jobs install ETHOS from its published release. These tables are the release's own
# Mise declaration, unchanged; mise.lock pins the archive of each declared platform.
[tools."http:ethos"]
version = "0.2.0-alpha.12"

[tools."http:ethos".platforms]
linux-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.12/ethos-0.2.0-alpha.12-linux-arm64.tar.gz", checksum = "sha256:5fd340d6c701e251ef2081c5634f090e84cd4419090df804a11f3f86025a9fe2", bin_path = "ethos/bin" }
linux-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.12/ethos-0.2.0-alpha.12-linux-x64.tar.gz", checksum = "sha256:8f7f16c9e02a53b6b7a5f867bbf666ddc4f6a94612d155fe5a37b79e4121dd24", bin_path = "ethos/bin" }
macos-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.12/ethos-0.2.0-alpha.12-macos-arm64.tar.gz", checksum = "sha256:f3016ed9f44a218f573670a46039fa12f2a962e597eacebbaf8db86ec6e3fc3e", bin_path = "ethos/bin" }
windows-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.12/ethos-0.2.0-alpha.12-windows-x64.tar.gz", checksum = "sha256:2e7795e49986fa4096daea030e6bbc61b45a4088d9b0d727ad84511dd13a18a5", bin_path = "ethos/bin" }

# package.json owns both development versions and npm archive integrity.
# The native idiomatic parser needs no executable template or second declaration.
[tool_alias]
npm = "npm:npm"

[settings]
locked = true
idiomatic_version_file_enable_tools = ["node", "npm"]

[settings.npm]
package_manager = "npm"

[tasks.bootstrap]
description = "Prepare the currently declared Node and npm through locked native Mise supply"
run = "mise install --locked node npm"

[tasks.check]
description = "Check selected source formatting and generated CI files without writing"
run = ["ethos lane format --check --json", "ethos lane project --check --json"]

[tasks.fix]
description = "Apply native formatting after exact Work Lane admission; pass --expect-head OID"
run = "ethos lane format --apply --authorize --json"
