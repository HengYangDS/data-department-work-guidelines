min_version = "2026.10.14"

# Contributors and hosted jobs install ETHOS from its published release. These tables are the
# release's own Mise declaration, unchanged; mise.lock pins the archive of each declared platform.
# ETHOS is the only declared tool and supplies its own Node and native checks.
[tools."http:ethos"]
version = "0.2.0-beta.9"

[tools."http:ethos".platforms]
linux-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.9/ethos-0.2.0-beta.9-linux-arm64.tar.gz", checksum = "sha256:2de6164354d9169c9fce7fa329ebcdc0d0c30c8b7bba2577ea4b012f9fabe2c2", bin_path = "ethos/bin" }
linux-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.9/ethos-0.2.0-beta.9-linux-x64.tar.gz", checksum = "sha256:524e75838a21b3cadd42e4a98c8d8394c12d08c4d8bad4f9cd5c5ad002a0b3a5", bin_path = "ethos/bin" }
macos-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.9/ethos-0.2.0-beta.9-macos-arm64.tar.gz", checksum = "sha256:c38e92b5b15fae69b677b51e7b7c3f6b78b05dcd5de5dfd2887dcb8c66008384", bin_path = "ethos/bin" }
windows-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.9/ethos-0.2.0-beta.9-windows-arm64.tar.gz", checksum = "sha256:52de43cd286d944050de10c420cc3e99222a2c777c4619daf454f89bb4e96100", bin_path = "ethos/bin" }
windows-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.9/ethos-0.2.0-beta.9-windows-x64.tar.gz", checksum = "sha256:beac4ddd347de6592f1057f61a79bc6b13ba906de26a9e0315e43869ffb1f8b4", bin_path = "ethos/bin" }

[settings]
locked = true
# Native `mise lock` writes these platforms; its default set omits Windows ARM64.
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64", "windows-arm64", "windows-x64"]

[tasks.bootstrap]
description = "Install the locked ETHOS release"
run = "mise install --locked"

[tasks.check]
description = "Check selected source formatting and generated CI files without writing"
run = ["ethos lane format --check --json", "ethos lane project --check --json"]

[tasks.fix]
description = "Apply native formatting after exact Work Lane admission; pass --expect-head OID"
run = "ethos lane format --apply --authorize --json"
