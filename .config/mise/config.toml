min_version = "2026.10.14"

# Contributors and hosted jobs install ETHOS from its published release. These tables are the
# release's own Mise declaration, unchanged; mise.lock pins the archive of each declared platform.
# ETHOS is the only declared tool and supplies its own Node and native checks.
[tools."http:ethos"]
version = "0.2.0-beta.7"

[tools."http:ethos".platforms]
linux-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.7/ethos-0.2.0-beta.7-linux-arm64.tar.gz", checksum = "sha256:0e0cf5ff579b62fb716bed175ff935185fe8110a3e9052123ca4c5abd4798ced", bin_path = "ethos/bin" }
linux-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.7/ethos-0.2.0-beta.7-linux-x64.tar.gz", checksum = "sha256:16f86e46d11a974e11548fb8db05657a2a30d75c2875893f6c27a03f784ea0ed", bin_path = "ethos/bin" }
macos-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.7/ethos-0.2.0-beta.7-macos-arm64.tar.gz", checksum = "sha256:696672649b9ec3c68b08fa6a6217f3c7e3a407ecf485f4d27de34b966f09bef6", bin_path = "ethos/bin" }
windows-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.7/ethos-0.2.0-beta.7-windows-arm64.tar.gz", checksum = "sha256:c3e2430afb4c8fcdd7c519e49e4df51774e62bc50bae0c5c78369935f2044efd", bin_path = "ethos/bin" }
windows-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.7/ethos-0.2.0-beta.7-windows-x64.tar.gz", checksum = "sha256:e34630f3aa21fcc7808d3e4df281d986303a2acd5b82032c5fd3767677b257a3", bin_path = "ethos/bin" }

[settings]
locked = true
# Native `mise lock` writes these platforms; its default set omits Windows ARM64.
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64", "windows-arm64", "windows-x64"]

[tasks.bootstrap]
description = "Install the locked ETHOS release"
run = "mise install --locked"

[tasks.check]
description = "Check selected source formatting and generated CI files without writing"
run = ["ethos lane format --check --json", "ethos lane project --check --json"]

[tasks.fix]
description = "Apply native formatting after exact Work Lane admission; pass --expect-head OID"
run = "ethos lane format --apply --authorize --json"
