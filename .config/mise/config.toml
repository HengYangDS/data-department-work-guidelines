min_version = "2026.10.14"

# Contributors and hosted jobs install ETHOS from its published release. These tables are the
# release's own Mise declaration, unchanged; mise.lock pins the archive of each declared platform.
# ETHOS is the only declared tool and supplies its own Node and native checks.
[tools."http:ethos"]
version = "0.2.0-alpha.23"

[tools."http:ethos".platforms]
linux-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.23/ethos-0.2.0-alpha.23-linux-arm64.tar.gz", checksum = "sha256:972d4d584d283606b7ed80facd39f26748a5f9a1a2016bea625d72b75aa91166", bin_path = "ethos/bin" }
linux-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.23/ethos-0.2.0-alpha.23-linux-x64.tar.gz", checksum = "sha256:3dba0ca1ed7d86acdb52329595a5b848c67a89511f761b15d36baf6e9a2acacd", bin_path = "ethos/bin" }
macos-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.23/ethos-0.2.0-alpha.23-macos-arm64.tar.gz", checksum = "sha256:1e7736a3065fdb2db96410f5ff088bbf2e318a7026554bec2a4070302962eceb", bin_path = "ethos/bin" }
windows-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.23/ethos-0.2.0-alpha.23-windows-arm64.tar.gz", checksum = "sha256:b6d0f24dbfbebbb2fda33d298133e7c73f39e32eef1876c48ff3363f34a34f4e", bin_path = "ethos/bin" }
windows-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.23/ethos-0.2.0-alpha.23-windows-x64.tar.gz", checksum = "sha256:ec4c7428dba6f5af32c7cc9c7e1e503435a6ca3e17b360ed4dd883f494725f65", bin_path = "ethos/bin" }

[settings]
locked = true
# Native `mise lock` writes these platforms; its default set omits Windows ARM64.
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64", "windows-arm64", "windows-x64"]

[tasks.bootstrap]
description = "Install the locked ETHOS release"
run = "mise install --locked"

[tasks.check]
description = "Check selected source formatting and generated CI files without writing"
run = ["ethos lane format --check --json", "ethos lane project --check --json"]

[tasks.fix]
description = "Apply native formatting after exact Work Lane admission; pass --expect-head OID"
run = "ethos lane format --apply --authorize --json"
