min_version = "2026.10.14"

# Contributors and hosted jobs install ETHOS from its published release. These tables are the
# release's own Mise declaration, unchanged; mise.lock pins the archive of each declared platform.
# ETHOS is the only declared tool and supplies its own Node and native checks.
[tools."http:ethos"]
version = "0.2.0-alpha.24"

[tools."http:ethos".platforms]
linux-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.24/ethos-0.2.0-alpha.24-linux-arm64.tar.gz", checksum = "sha256:845f99010a49efc3acfd11daa31f6162ec1d8d887ed3e7e5595d8517326a9bef", bin_path = "ethos/bin" }
linux-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.24/ethos-0.2.0-alpha.24-linux-x64.tar.gz", checksum = "sha256:a10d1586cc740cc432078624f67ac51dbb42defd008f098a5437baa743e4f2b2", bin_path = "ethos/bin" }
macos-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.24/ethos-0.2.0-alpha.24-macos-arm64.tar.gz", checksum = "sha256:8b817f6105098d232013d124a6ea01c2c3605bab1219a2152743c487d3367309", bin_path = "ethos/bin" }
windows-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.24/ethos-0.2.0-alpha.24-windows-arm64.tar.gz", checksum = "sha256:5695595aa62fe87dffc92c9a11098bc9f11533081ed7d9de04a2c66b6b2e16ae", bin_path = "ethos/bin" }
windows-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.24/ethos-0.2.0-alpha.24-windows-x64.tar.gz", checksum = "sha256:178382144c5dca98b0d86a4bdfa9a1129aa5c0b1751ebb9b68d8f23a07f7885c", bin_path = "ethos/bin" }

[settings]
locked = true
# Native `mise lock` writes these platforms; its default set omits Windows ARM64.
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64", "windows-arm64", "windows-x64"]

[tasks.bootstrap]
description = "Install the locked ETHOS release"
run = "mise install --locked"

[tasks.check]
description = "Check selected source formatting and generated CI files without writing"
run = ["ethos lane format --check --json", "ethos lane project --check --json"]

[tasks.fix]
description = "Apply native formatting after exact Work Lane admission; pass --expect-head OID"
run = "ethos lane format --apply --authorize --json"
