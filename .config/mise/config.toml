min_version = "2026.10.14"

# Contributors and hosted jobs install ETHOS from its published release. These tables are the
# release's own Mise declaration, unchanged; mise.lock pins the archive of each declared platform.
# ETHOS is the only declared tool and supplies its own Node and native checks.
[tools."http:ethos"]
version = "0.2.0-alpha.25"

[tools."http:ethos".platforms]
linux-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.25/ethos-0.2.0-alpha.25-linux-arm64.tar.gz", checksum = "sha256:7975c4b1bae4a1b68c56606353dc25e0d1de185c2fa089ac5015c4edf2ad6421", bin_path = "ethos/bin" }
linux-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.25/ethos-0.2.0-alpha.25-linux-x64.tar.gz", checksum = "sha256:6929df9e973b6de0491d3cd6dde42e3e96f44f7bb40bdf133d8ad2d746c833df", bin_path = "ethos/bin" }
macos-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.25/ethos-0.2.0-alpha.25-macos-arm64.tar.gz", checksum = "sha256:ad00cb3efe0f95b430df45f9606b23dbf288b0443756f8881c213fd602a2da1b", bin_path = "ethos/bin" }
windows-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.25/ethos-0.2.0-alpha.25-windows-arm64.tar.gz", checksum = "sha256:61af39e5b93102350e34ea8c9965896f89cab3fcdc35a0baea436a1c818f4b93", bin_path = "ethos/bin" }
windows-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.25/ethos-0.2.0-alpha.25-windows-x64.tar.gz", checksum = "sha256:ab673f4c75f2dd9cfc39b0cc07f790421a488f2b4da9a749b2e90956fd084191", bin_path = "ethos/bin" }

[settings]
locked = true
# Native `mise lock` writes these platforms; its default set omits Windows ARM64.
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64", "windows-arm64", "windows-x64"]

[tasks.bootstrap]
description = "Install the locked ETHOS release"
run = "mise install --locked"

[tasks.check]
description = "Check selected source formatting and generated CI files without writing"
run = ["ethos lane format --check --json", "ethos lane project --check --json"]

[tasks.fix]
description = "Apply native formatting after exact Work Lane admission; pass --expect-head OID"
run = "ethos lane format --apply --authorize --json"
