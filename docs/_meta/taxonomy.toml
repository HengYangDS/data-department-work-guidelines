[meta]
version = 1
owner = "data-department"

[semantic_axes]
required = ["subject", "role", "state", "relations"]

[states]
allowed = ["canonical", "active", "planned", "experimental", "superseded", "archived"]

[roles]
allowed = [
  "index",
  "explanation",
  "reference",
  "decision",
  "policy",
  "evidence",
  "history",
  "template",
  "plan",
  "research",
  "findings",
  "progress",
  "ledger",
  "how-to",
]

# ETHOS governs core directories; only repository extension roots belong here.
[extension_roots]
"docs/governance" = ["policy", "explanation", "ledger", "index"]
