[claim]
id = "ddwg-dual-forge-runner-convergence-20260721"
change_id = "ddwg-dual-forge-runner-convergence"
subject = "data-department-work-guidelines:dual-forge-runner-isolation"
state = "active"
summary = "This active Change records the repository-local binding for independent GitHub and GitLab documentation runners; provider registration, policy tightening, publication, and job execution remain separate external observations."

[evidence]
dated = "evidence/chronicle/ddwg-dual-forge-runner-convergence-20260721/2026-07-21.md"
sha256 = "880593ebf7c94aab0d9070c403f6682368aca5f7d6f081be215f9971a6fab3f6"
evidence_ids = ["evidence:ddwg-dual-forge-runner-convergence-20260721"]
binding = "This record binds one active repository Change, its checked-in workflow selectors, the CI contract test, and the dated local observation. It does not grant authority to reuse a runner, change another project, read or record credentials, configure provider state without a fresh control-plane observation, or treat local work as provider-run evidence."
verifier = "digest_only"
tests = [
  "bash tests/validate-ci-runtime-binding.sh",
  "glab ci lint --include-jobs --dry-run --ref dev --repo dig/misc/guidelines/data-department-work-guidelines .gitlab-ci.yml",
  "./scripts/ethos-repo.sh openspec --lifecycle --json",
  "./scripts/ethos-repo.sh quality claims --json",
  "./scripts/ethos-repo.sh prove --execute --scope docs --expect-head <committed-head> --json",
]

[evidence.freshness]
mode = "historical"

[boundary]
owner = "data-department-work-guidelines"
scope = "One repository's GitHub macOS runner selector and GitLab Docker runner tag contract; provider-side registration, remote runner policy, publishing, job execution, and all other projects excluded."

[carriers]
openspec = "openspec/changes/ddwg-dual-forge-runner-convergence"

fallback = "Keep the two provider projections blocked or queued when their dedicated runner is unavailable; do not use hosted fallback capacity, cross-project labels, or the other Forge's runner."
kill_signal = "A different project or Forge schedules work on either runner, a fork-origin pull request executes on the GitHub host, an untagged GitLab job is accepted after policy tightening, or local proof is described as provider-run evidence."

[promotion]
targets = [
  ".ethos/profile.toml",
  ".github/workflows/docs-verify.yml",
  ".gitlab-ci.yml",
  "CHANGELOG.md",
  "docs/governance/ethos.md",
  "evidence/claims/ddwg-dual-forge-runner-convergence-20260721.toml",
  "evidence/chronicle/ddwg-dual-forge-runner-convergence-20260721/2026-07-21.md",
  "openspec/changes/ddwg-dual-forge-runner-convergence",
  "openspec/specs/repository-governance/spec.md",
  "tests/validate-ci-runtime-binding.sh",
]
