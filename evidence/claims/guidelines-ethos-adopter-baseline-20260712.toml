verifier = "semantic_attested"
tests = [
  "./scripts/validate-docs.sh",
  "./scripts/validate-rollout-readiness.sh",
  "./scripts/ethos-repo.sh quality docs-topology --json",
  "./scripts/ethos-repo.sh quality generated-artifacts --json",
  "./scripts/ethos-repo.sh quality claims --json",
  "./scripts/ethos-repo.sh quality evidence-freshness --json",
  "./scripts/test-ethos-repo.sh",
