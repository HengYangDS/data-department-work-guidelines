summary = "The guidelines repository has a local ETHOS adopter baseline that binds document changes to work-lane admission, a repository-bound ETHOS command adapter, a semantic documentation kernel, durable claims and Chronicle, and HEAD-bound local proof; remote GitLab publication remains outside this claim."

[evidence]
dated = "evidence/chronicle/guidelines-ethos-adopter-baseline-20260712/2026-07-12.md"
sha256 = "2e0c28267780d320d70a9199d6d301892fb6f6b0df772aec71b498bd07830390"
evidence_ids = ["evidence:guidelines-ethos-adopter-baseline-20260712"]
