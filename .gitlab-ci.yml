workflow:
  rules:
    - &offline-candidate
      if: '$DDWG_OFFLINE_CANDIDATE && $CI_COMMIT_REF_PROTECTED == "true" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main") && ($CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "web")'
    - &exclude-candidate
      if: "$DDWG_OFFLINE_CANDIDATE"
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v[^\/]*$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^proposal\// && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^proposal\//'

stages:
  - verify

default:
  image: public.ecr.aws/docker/library/node:26-trixie@sha256:39cff0f037088f0d8faf3e5a3ca055d653a15b66faaba8af3daf72f0102f375f

.docs:source-supply:
  before_script: &docs-source-supply
    - npm ci --ignore-scripts
    - node tools/ci/install-native.mjs osv-scanner --gitlab-package
    - node tools/docs/cli.mjs audit
    - node tools/ci/install-native.mjs lychee --gitlab-package
    - node tools/ci/install-native.mjs vale --gitlab-package

.docs:native-runtime:
  variables: &native-runtime
    MISE_OVERRIDE_CONFIG_FILENAMES: .config/supply/mise.toml
    MISE_CONFIG_DIR: "$CI_PROJECT_DIR/build/runtime/work/mise-config"
    MISE_CEILING_PATHS: "$CI_PROJECT_DIR/.."
    MISE_TRUSTED_CONFIG_PATHS: "$CI_PROJECT_DIR/.config/supply/mise.toml"
    MISE_YES: "1"
  before_script: &native-runtime-supply
    - mise install --locked --jobs=1

.docs:native-source-supply:
  before_script: &native-source-supply
    - *native-runtime-supply
    - mise exec --locked -- npm ci --ignore-scripts
    - mise exec --locked -- node tools/ci/install-native.mjs osv-scanner --gitlab-package
    - mise exec --locked -- node tools/docs/cli.mjs audit
    - mise exec --locked -- node tools/ci/install-native.mjs lychee --gitlab-package
    - mise exec --locked -- node tools/ci/install-native.mjs vale --gitlab-package

.docs:verify:
  stage: verify
  timeout: 20m
  interruptible: true
  variables:
    GIT_DEPTH: "0"
  artifacts:
    when: always
    paths:
      - build/evidence/dependencies/
  before_script:
    - npm install --global --ignore-scripts "npm@$(node -p 'require("./package.json").devEngines.packageManager.version')"
    - *docs-source-supply
  script:
    - npm run verify

docs:verify:linux:
  extends: .docs:verify
  tags:
    - ci-linux-arm64-container-protected
  rules:
    - *exclude-candidate
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v[^\/]*$/'

docs:verify:linux:review:
  extends: .docs:verify
  tags:
    - ci-linux-arm64-container
  rules:
    - *exclude-candidate
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^proposal\// && $CI_PIPELINE_SOURCE == "push"'

docs:verify:macos:
  extends: .docs:verify
  inherit:
    default: false
  variables: *native-runtime
  before_script: *native-source-supply
  script:
    - mise exec --locked -- npm run verify
  tags:
    - ci-macos-arm64-shell
  rules:
    - *exclude-candidate
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v[^\/]*$/'

docs:verify:macos:review:
  extends: .docs:verify
  inherit:
    default: false
  variables: *native-runtime
  before_script: *native-source-supply
  script:
    - mise exec --locked -- npm run verify
  tags:
    - ci-macos-arm64-review
  rules:
    - *exclude-candidate
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^proposal\// && $CI_PIPELINE_SOURCE == "push"'

docs:verify:windows:
  resource_group: windows-verification
  extends: .docs:verify
  inherit:
    default: false
  variables: *native-runtime
  before_script: *native-source-supply
  script:
    - mise exec --locked -- npm run verify
  tags:
    - ci-windows-arm64-shell
  rules:
    - *exclude-candidate
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v[^\/]*$/'

docs:verify:windows:review:
  resource_group: windows-verification
  extends: .docs:verify
  inherit:
    default: false
  variables: *native-runtime
  before_script: *native-source-supply
  script:
    - mise exec --locked -- npm run verify
  tags:
    - ci-windows-arm64-review
  rules:
    - *exclude-candidate
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^proposal\// && $CI_PIPELINE_SOURCE == "push"'

.offline:verify:
  stage: verify
  timeout: 25m
  interruptible: true
  rules:
    - *offline-candidate
    - *exclude-candidate
    - if: '$CI_COMMIT_TAG =~ /^v[^\/]*$/ && $CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_TAG =~ /^v[^\/]*$/ && $CI_PIPELINE_SOURCE == "api"'
  variables:
    GIT_DEPTH: "0"
  before_script:
    - npm install --global --ignore-scripts "npm@$(node -p 'require("./package.json").devEngines.packageManager.version')"
  script:
    - node tools/ci/offline-bundle.mjs acquire-gitlab
    - node tools/ci/offline-bundle.mjs install
    - npm run verify

offline:verify:linux:
  extends: .offline:verify
  tags:
    - ci-linux-arm64-container-protected

offline:verify:macos:
  extends: .offline:verify
  inherit:
    default: false
  variables: *native-runtime
  before_script: *native-runtime-supply
  script:
    - mise exec --locked -- node tools/ci/offline-bundle.mjs acquire-gitlab
    - mise exec --locked -- node tools/ci/offline-bundle.mjs install
    - mise exec --locked -- npm run verify
  tags:
    - ci-macos-arm64-shell

offline:verify:windows:
  resource_group: windows-verification
  extends: .offline:verify
  inherit:
    default: false
  variables: *native-runtime
  before_script: *native-runtime-supply
  script:
    - mise exec --locked -- node tools/ci/offline-bundle.mjs acquire-gitlab
    - mise exec --locked -- node tools/ci/offline-bundle.mjs install
    - mise exec --locked -- npm run verify
  tags:
    - ci-windows-arm64-shell
