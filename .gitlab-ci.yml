stages:
  - verify

docs:verify:
  stage: verify
  image: node:22-bookworm
  tags:
    - ci-linux-arm64-docker
  interruptible: true
  variables:
    GIT_DEPTH: "0"
  before_script:
    - npm ci --ignore-scripts
    - npm audit --audit-level=moderate
    - node tools/ci/install-lychee.mjs --download
  script:
    - npm run verify
