stages:
  - verify

default:
  image: public.ecr.aws/docker/library/node:26-bookworm@sha256:2aaae6d91f99fee84cfc92da9b52c22a185752d247746052bbc3f961e44478c6

docs:verify:
  stage: verify
  tags:
    - ci-linux-arm64-docker
  interruptible: true
  variables:
    GIT_DEPTH: "0"
  before_script:
    - npm ci --ignore-scripts
    - npm audit --audit-level=moderate
    - node tools/ci/install-lychee.mjs --gitlab-package
  script:
    - npm run verify

offline:verify:
  stage: verify
  tags:
    - ci-linux-arm64-docker
  interruptible: true
  rules:
    - if: '$CI_COMMIT_TAG && $CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_TAG && $CI_PIPELINE_SOURCE == "api"'
  variables:
    GIT_DEPTH: "0"
  script:
    - node tools/ci/offline-bundle.mjs acquire-gitlab
    - node tools/ci/offline-bundle.mjs install
    - npm run verify
