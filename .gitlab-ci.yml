stages:
  - verify

docs:verify:
  stage: verify
  image: node:22-bookworm
  tags:
    - ci-linux-arm64-docker
  interruptible: true
  variables:
    GIT_DEPTH: "0"
    DDWG_HOSTED_RENDERER_CONFIG: "tools/ci/config/mermaid-puppeteer-hosted.json"
    PUPPETEER_SKIP_DOWNLOAD: "true"
    PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
  before_script:
    - apt-get update && apt-get install --yes --no-install-recommends git chromium ca-certificates
    - npm ci --ignore-scripts
    - node tools/ci/install-lychee.mjs --download
  script:
    - npm run verify
