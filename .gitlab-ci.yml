workflow:
  rules:
    - if: "$CI_COMMIT_TAG"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^proposal\// && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^proposal\//'

stages:
  - verify

default:
  image: public.ecr.aws/docker/library/node:26-bookworm@sha256:2aaae6d91f99fee84cfc92da9b52c22a185752d247746052bbc3f961e44478c6

docs:verify:
  stage: verify
  timeout: 20m
  tags:
    - ci-linux-arm64-container-protected
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG'
  interruptible: true
  variables:
    GIT_DEPTH: "0"
  before_script:
    - npm ci --ignore-scripts
    - npm audit --audit-level=moderate
    - node tools/ci/install-lychee.mjs --gitlab-package
  script:
    - npm run verify

docs:verify:linux:review:
  extends: docs:verify
  tags:
    - ci-linux-arm64-container
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^proposal\// && $CI_PIPELINE_SOURCE == "push"'

docs:verify:macos:
  extends: docs:verify
  inherit:
    default: false
  tags:
    - ci-macos-arm64-shell
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG'

docs:verify:macos:review:
  extends: docs:verify
  inherit:
    default: false
  tags:
    - ci-macos-arm64-review
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^proposal\// && $CI_PIPELINE_SOURCE == "push"'

docs:verify:windows:
  extends: docs:verify
  inherit:
    default: false
  tags:
    - ci-windows-arm64-shell
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG'

docs:verify:windows:review:
  extends: docs:verify
  inherit:
    default: false
  tags:
    - ci-windows-arm64-review
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^proposal\// && $CI_PIPELINE_SOURCE == "push"'

offline:verify:
  stage: verify
  timeout: 25m
  tags:
    - ci-linux-arm64-container-protected
  interruptible: true
  rules:
    - if: '$CI_COMMIT_TAG && $CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_TAG && $CI_PIPELINE_SOURCE == "api"'
  variables:
    GIT_DEPTH: "0"
  script:
    - node tools/ci/offline-bundle.mjs acquire-gitlab
    - node tools/ci/offline-bundle.mjs install
    - npm run verify

offline:verify:macos:
  extends: offline:verify
  inherit:
    default: false
  tags:
    - ci-macos-arm64-shell

offline:verify:windows:
  extends: offline:verify
  inherit:
    default: false
  tags:
    - ci-windows-arm64-shell
