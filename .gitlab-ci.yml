    - mise install --locked --jobs=1
    - mkdir -p build/evidence/ci
  image: public.ecr.aws/docker/library/node:26-trixie@sha256:1b84b89ada025e3b14543cbb837ffaa1c1b5273b841c5b94dd1a8f9c1d8cf7fe
  rules:
    - if: $ETHOS_OFFLINE_CANDIDATE
