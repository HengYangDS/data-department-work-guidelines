[command_plane]
public = "ethos"

[formats]
user_config = "TOML"
machine_output = "JSON"
append_only_events = "JSONL"
local_state = "SQLite"

[artifacts]
state_path = ".ethos/state/state.sqlite"
state_tracked_truth = false
durable_evidence_roots = ["evidence", "evidence/claims"]

[gates]
governance_audit = "./scripts/ethos-repo.sh report --json"
proof = "./scripts/ethos-repo.sh prove --execute --scope docs --expect-head $(git rev-parse HEAD) --json"
report = "./scripts/ethos-repo.sh report --json"
openspec = "openspec validate --all --strict --json"
docs_integrity = "./scripts/validate-docs.sh"
markdown_format = "./scripts/format-markdown.sh --check"
