# ETHOS repository binding manifest — the adopter entrypoint.
#
# This profile uses the current typed declaration. The root-level guideline is a
# normative file, not a synthetic rules directory or the repository root.
profile_id = "data-department-work-guidelines"
normative_sources = ["guidelines.md"]

# Repository surface roots. These match the ETHOS defaults; override only the ones
# your repository places elsewhere.
[roots]
# `rules` remains a repository-relative directory root. The root-level
# `guidelines.md` authority is declared above in `normative_sources`.
rules = "rules"
docs = "docs"
durable_evidence = "evidence"
openspec = "openspec"
claims = "evidence/claims"
agent_skills = ".agents/skills"
local_state = ".ethos/state"

# ETHOS names these required axes “code correctness”; for this documentation
# repository they mean reader-visible behavior and static document integrity.
[openspec]
# ETHOS owns this repository-relative admission contract. The companion beside
# an active Change is product-defined data; it is not an OpenSpec schema.
material_paths = [
  ".ethos/**",
  ".githooks/**",
  ".github/**",
  ".gitlab-ci.yml",
  "AGENTS.md",
  "CHANGELOG.md",
  "docs/**",
  "evidence/**",
  "evolution/**",
  "guidelines.md",
  "openspec/**",
  "scripts/**",
  "tests/**",
  "tools/ci/**",
]

[proof]
code_correctness_gates = ["docs-integrity", "markdown-format"]

[proof.code_correctness_map]
behavior = "docs-integrity"
static-analysis = "markdown-format"

[[proof.gates]]
id = "docs-integrity"
kind = "test"
command = ["bash", "./scripts/validate-docs.sh"]
asset_classes = ["markdown-docs"]
dimensions = ["behavior", "documentation", "links", "rendering"]
execution_mode = "subprocess"
evidence_class = "proof"
trust_bearing = true
tool_adapter = "repository-native"
network_policy = "offline"

[[proof.gates]]
id = "markdown-format"
kind = "lint"
command = ["bash", "./scripts/format-markdown.sh", "--check"]
asset_classes = ["markdown-docs"]
dimensions = ["static-analysis", "format", "markdown"]
execution_mode = "subprocess"
evidence_class = "contract"
trust_bearing = true
tool_adapter = "prettier"
network_policy = "offline"

[[proof.gates]]
id = "repository-root-binding"
kind = "test"
command = ["bash", "./scripts/test-ethos-repo.sh"]
asset_classes = ["repository-governance"]
dimensions = ["governance", "authority", "target-binding"]
execution_mode = "subprocess"
evidence_class = "proof"
trust_bearing = true
tool_adapter = "repository-native"
network_policy = "offline"
