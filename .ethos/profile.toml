# ETHOS repository binding manifest — the adopter entrypoint.
#
# Normative guidance has one semantic owner per reader task.
profile_id = "data-department-work-guidelines"
normative_sources = [
  "docs/charter.md",
  "docs/decide.md",
  "docs/deliver.md",
  "docs/data.md",
  "docs/communicate.md",
  "docs/human-agent.md",
  "docs/evolve.md",
]

[openspec]
# ETHOS owns this repository-relative admission contract. Changed paths matching
# these patterns must be attributed to one selected active official Change.
material_paths = ["**"]

# One native registry owns the two document roots and their prerequisites.
# ETHOS obtains behavior evidence from its own test attempt, not the output
# of a document command. See the registry for execution and evidence bounds.
[proof]
gate_registry = ".ethos/gates.toml"
