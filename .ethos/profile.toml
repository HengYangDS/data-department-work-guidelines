# ETHOS repository binding manifest — the adopter entrypoint.
#
# Normative guidance has one semantic owner per reader task.
profile_id = "data-department-work-guidelines"
normative_sources = [
  "docs/charter.md",
  "docs/decide.md",
  "docs/deliver.md",
  "docs/data.md",
  "docs/communicate.md",
  "docs/human-agent.md",
  "docs/evolve.md",
]

# The two default commands check repository documents. ETHOS independently
# verifies tracked JavaScript behavior and static syntax for the mapped axes.
[openspec]
# ETHOS owns this repository-relative admission contract. Changed paths matching
# these patterns must be attributed to one selected active official Change.
material_paths = ["**"]

[proof]
code_correctness_gates = ["docs-integrity", "markdown-format"]

[proof.code_correctness_map]
behavior = "docs-integrity"
static-analysis = "markdown-format"

[[proof.gates]]
id = "docs-integrity"
kind = "test"
command = ["node", "tools/docs/cli.mjs", "check"]
verification_providers = ["ethos.adapters.gates.code_quality:behavior_report"]
asset_classes = ["markdown-docs", "javascript-code"]
dimensions = ["behavior", "documentation", "links"]
execution_mode = "verified-command"
evidence_class = "proof"
trust_bearing = true
tool_adapter = "ethos"
network_policy = "offline"

[[proof.gates]]
id = "markdown-format"
kind = "lint"
command = ["node", "tools/docs/cli.mjs", "format", "--check"]
verification_providers = ["ethos.adapters.gates.code_quality:static_report"]
asset_classes = ["markdown-docs", "javascript-code"]
dimensions = ["static-analysis", "format", "markdown"]
execution_mode = "verified-command"
evidence_class = "contract"
trust_bearing = true
tool_adapter = "ethos"
network_policy = "offline"
