# ETHOS repository binding manifest — the adopter entrypoint.
#
# Normative guidance has one semantic owner per reader task.
profile_id = "data-department-work-guidelines"
normative_sources = [
  "docs/charter.md",
  "docs/decide.md",
  "docs/deliver.md",
  "docs/data.md",
  "docs/communicate.md",
  "docs/human-agent.md",
  "docs/evolve.md",
]

[openspec]
# ETHOS owns this repository-relative admission contract. Changed paths matching
# these patterns must be attributed to one selected active official Change.
material_paths = ["**"]

# Default roots and their complete native dependency closure have one owner.
# The product supplies behavior evidence independently of document commands.
[proof]
code_correctness_gates = ["docs-integrity", "markdown-format"]

[proof.code_correctness_map]
behavior = "code-behavior"
static-analysis = "markdown-format"

[[proof.gates]]
id = "docs-integrity"
kind = "test"
command = ["node", "tools/docs/cli.mjs", "check"]
depends_on = ["code-behavior", "document-registry", "markdown-lint"]
asset_classes = ["markdown-docs", "javascript-code"]
dimensions = ["documentation", "links"]
evidence_class = "proof"
trust_bearing = true
network_policy = "offline"

[[proof.gates]]
id = "markdown-format"
kind = "lint"
providers = [
  "ethos.adapters.gates.formatting:source_format_report",
  "ethos.adapters.gates.code_quality:static_report",
]
asset_classes = ["markdown-docs", "javascript-code"]
dimensions = ["static-analysis", "format", "markdown"]
evidence_class = "contract"
trust_bearing = true
network_policy = "offline"

[[proof.gates]]
id = "code-behavior"
kind = "test"
providers = ["ethos.adapters.gates.code_quality:behavior_report"]
asset_classes = ["javascript-code"]
dimensions = ["behavior"]
evidence_class = "proof"
trust_bearing = true
network_policy = "offline"
timeout_seconds = 180
cpu_reservation = 2

[[proof.gates]]
id = "markdown-lint"
kind = "lint"
providers = ["ethos.adapters.gates.tool:markdown_lint_report"]
asset_classes = ["markdown-docs"]
dimensions = ["markdown", "documentation"]
evidence_class = "contract"
trust_bearing = true
network_policy = "offline"

[[proof.gates]]
id = "document-registry"
kind = "docs"
providers = ["ethos.surface.cli.root.reference:docs_registry_report"]
asset_classes = ["markdown-docs"]
dimensions = ["documentation", "decision-records"]
evidence_class = "contract"
trust_bearing = true
network_policy = "offline"
