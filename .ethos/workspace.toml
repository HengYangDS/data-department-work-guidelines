[[package]]
name = "root"
path = "."
domains = ["repository"]

# This repository is initialized with a local ETHOS train. `main` remains the
# release-facing branch; `dev` is the accepted local root; `candidate/dev`
# gathers proven work before an explicit accepted-root closeout.
[branch_roles]
release_branch = "main"
accepted_branch = "dev"
candidate_branch = "candidate/dev"
work_branch_prefix = "work/"
proposal_branch_prefix = "proposal/"
release_mirror = "accepted_ff"
canonical_sibling_worktrees = true

[commit_policy]
# Conventional Commits 1.0.0, with a repository-required scope and short subject.
subject_pattern = '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)\([a-z][a-z0-9-]*\)!?: [a-z][^\r\n]{0,68}[a-z0-9]$'
signing_required = true
signing_format = "ssh"
