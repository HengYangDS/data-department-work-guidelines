name: Documentation verification

on:
  push:
    branches:
      - dev
      - main
      - 'proposal/**'
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DDWG_HOSTED_RENDERER_CONFIG: tools/ci/config/mermaid-puppeteer-hosted.json
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22

      - name: Set up stable Chrome
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4  # v2.2.0
        with:
          chrome-version: stable

      - name: Install locked documentation tools
        run: npm ci --ignore-scripts

      - name: Install pinned lychee
        run: bash tools/ci/scripts/install-lychee.sh

      - name: Verify documentation and governance boundaries
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: bash tools/ci/scripts/with-python-runtime.sh -- bash tools/ci/scripts/run-documentation-verification.sh
