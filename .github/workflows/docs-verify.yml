name: Documentation verification

on:
  push:
    branches:
      - dev
      - main
      - "proposal/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          check-latest: true
          package-manager-cache: false

      - name: Read the native package-manager declaration
        id: npm-version
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + require('./package.json').devEngines.packageManager.version + '\n')"

      - name: Install the declared package manager
        run: npm install --global --ignore-scripts npm@${{ steps.npm-version.outputs.version }}

      - name: Install locked documentation tools
        run: npm ci --ignore-scripts

      - name: Audit locked dependencies
        run: npm audit --audit-level=moderate

      - name: Install pinned lychee
        run: node tools/ci/install-native.mjs lychee --download

      - name: Supply pinned Vale
        run: node tools/ci/install-native.mjs vale --download

      - name: Verify documentation and governance boundaries
        run: npm run verify
