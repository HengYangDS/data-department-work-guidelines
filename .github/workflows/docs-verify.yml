name: Documentation verification

on:
  push:
    branches:
      - dev
      - main
      - "proposal/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DDWG_HOSTED_RENDERER_CONFIG: .config/tools/mermaid-hosted.json
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set up stable Chrome
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: 154.0.8037.57 # stable Chrome for Testing; preserve the macOS .app bundle

      - name: Install locked documentation tools
        run: npm ci --ignore-scripts

      - name: Audit locked dependencies
        run: npm audit --audit-level=moderate

      - name: Install pinned lychee
        run: node tools/ci/install-lychee.mjs --download

      - name: Verify documentation and governance boundaries
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run verify
