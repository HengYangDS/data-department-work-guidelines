name: Documentation verification

on:
  push:
    branches:
      - dev
      - main
      - 'submit/**'
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Install Python runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends python3 python3-venv

      - name: Install locked documentation tools
        run: npm ci --ignore-scripts

      - name: Verify documentation and governance boundaries
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: bash tools/ci/scripts/with-python-runtime.sh -- bash tools/ci/scripts/run-documentation-verification.sh
