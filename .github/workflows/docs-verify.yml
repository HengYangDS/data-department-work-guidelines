name: Documentation verification

on:
  push:
    branches:
      - dev
      - main
      - 'submit/**'
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  verify:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - ${{ vars.DDWG_GITHUB_RUNNER_LABEL }}
    timeout-minutes: 15
    env:
      DDWG_HOSTED_RENDERER_CONFIG: tools/ci/config/mermaid-puppeteer-hosted.json
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      PUPPETEER_EXECUTABLE_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    steps:
      - uses: actions/checkout@v4

      - name: Select project-local runner runtimes
        shell: bash
        run: |
          printf '%s\n' '/opt/homebrew/opt/node@22/bin' >> "$GITHUB_PATH"
          test -x '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
          /opt/homebrew/opt/node@22/bin/node --version | grep -Eq '^v22\.'
          python3 --version

      - name: Install locked documentation tools
        run: npm ci --ignore-scripts

      - name: Verify documentation and governance boundaries
        run: bash tools/ci/scripts/with-python-runtime.sh -- bash tools/ci/scripts/run-documentation-verification.sh
