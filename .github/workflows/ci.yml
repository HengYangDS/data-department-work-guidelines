name: Documentation verification
"on":
  push:
    branches:
      - dev
      - main
      - proposal/**
    tags:
      - v*
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.10.17
          install: false
          cache: false
      - name: Acquire locked product supply
        run: mise install --locked --jobs=1
      - name: Check locked supply
        run: mise exec --locked -- npm ci --ignore-scripts
      - name: Check locked supply
        run: mise exec --locked -- node tools/ci/install-native.mjs osv-scanner --download
      - name: Check locked supply
        run: mise exec --locked -- node tools/docs/cli.mjs audit
      - name: Prepare owned evidence directory
        shell: bash
        run: mkdir -p build/evidence/ci
      - name: Execute installed verification
        run: mise exec --locked -- ethos prove --host --execute --full --json > build/evidence/ci/verification.json
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: verification-${{ matrix.os }}
          path: |-
            build/evidence/ci/verification.json
            build/evidence/dependencies/
          if-no-files-found: error
