name: Offline release verification

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed release tag (vX.Y.Z)
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      DDWG_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: Set up Node 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          check-latest: true
          package-manager-cache: false

      - name: Read the native package-manager declaration
        id: npm-version
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + require('./package.json').devEngines.packageManager.version + '\n')"

      - name: Install the declared package manager
        run: npm install --global --ignore-scripts npm@${{ steps.npm-version.outputs.version }}

      - name: Acquire exact release bundle
        run: node tools/ci/offline-bundle.mjs acquire-github

      - name: Install without remote supply
        run: node tools/ci/offline-bundle.mjs install

      - name: Verify source and governance
        run: npm run verify
