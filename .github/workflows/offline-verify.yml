name: Offline release verification

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed release tag (vX.Y.Z)
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      DDWG_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Acquire exact release bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: "1"
        run: node tools/ci/offline-bundle.mjs acquire-github

      - name: Install without remote supply
        run: node tools/ci/offline-bundle.mjs install

      - name: Verify source and governance
        run: npm run verify
