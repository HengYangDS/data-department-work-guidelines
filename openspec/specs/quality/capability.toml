family = "quality"
primary_invariant = "The quality capability keeps quality, determinism, docs profile, and proof policy cohesive and provider-neutral."
routing_question = "Does this change alter quality, determinism, docs profile, and proof policy?"
decision_axes = ["lifecycle", "surface", "authority"]
boundary_rules = [
  "Capability IDs name stable product semantics, not implementation package names.",
  "OpenSpec records are specification carriers, not truth owners.",
  "Provider or adopter-specific state remains in adapters, profiles, or evidence.",
]
aliases = []

[owner]
package = "ethos-core"
scope = "quality, determinism, docs profile, and proof policy"

[recommended_facets]
lifecycle = ["authoring", "validation", "runtime"]
surface = ["cli", "docs", "schema", "openspec", "evidence"]
authority = ["source", "test", "schema", "docs", "openspec", "claim", "evidence"]

[proof_profile]
default_command = "./scripts/ethos-repo.sh prove --json"
executed_command = "./scripts/ethos-repo.sh prove --execute --json"
required_gates = ["claims", "schemas"]
