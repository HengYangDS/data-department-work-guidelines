schema: spec-driven
context: |
  This repository uses an official OpenSpec Change for material intent,
  design, specification deltas, and task progress. ETHOS owns material-path
  attribution, Work Lane admission, proof, acceptance, and publication.
  Source, tests, and current observations bound each completion claim.
rules:
  proposal:
    - Explain the problem, intended change, and explicit out-of-scope boundary.
    - Name affected capabilities and repository-relative source boundaries;
      use official artifact fields without private routing metadata.
  specs:
    - Use ADDED, MODIFIED, REMOVED, or RENAMED Requirements in Change deltas;
      main specs keep one Requirements section.
    - Include at least one Scenario with WHEN and THEN clauses for each
      requirement.
  tasks:
    - Follow the selected official task template with numbered groups and
      checkbox actions; put each completion check in its task description.
    - Keep each action bounded and dependency-ordered. Include the tests and
      documentation its group owes; reserve final checks for integration.
    - Keep only task actions, completion checks, and checkbox state here.
      Reference existing evidence when needed; do not copy command output,
      execution checkpoints, debugging narratives, or acceptance reports.
  design:
    - Record architecture, tradeoffs, authority boundaries, and migration risks.
